[project]
name = "jasonpats-ml-concepts-lab-api"
version = "0.1.0"
description = "Backend API for JasonPatS's ML Concepts Lab"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
